name: validate

on:
  push:
    # Keep `ruff.toml` and this workflow in the filter: a commit that narrows
    # the tool floor, or edits the gate itself, is exactly the change CI must
    # not skip. `pull_request` is deliberately unfiltered.
    paths: ['data/**', 'config/**', 'scripts/**', 'schema/**', 'ruff.toml',
            '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema ruff
      # The tool floor, in two halves. Linting alone is not the floor: `ruff
      # check` passes happily against a narrowed `select`, so the assertion
      # below is what makes removing a rule family a hard failure rather than a
      # silent pass. Mirrors ~/.claude/bin/tool-floor.py, which cannot run here
      # because it lives outside the repo. Keep the two lists in step.
      - name: Check the tool floor is enforceable
        run: |
          python3 - <<'PY'
          import sys, tomllib, pathlib
          REQUIRED = {"F", "ARG", "B", "RUF"}
          p = pathlib.Path("ruff.toml")
          if not p.exists():
              print("::error::ruff.toml is missing — the tool floor is not enforceable")
              sys.exit(1)
          select = set(tomllib.loads(p.read_text()).get("lint", {}).get("select", []))
          missing = sorted(REQUIRED - select)
          if missing:
              print(f"::error::ruff.toml no longer selects required rule "
                    f"{'family' if len(missing) == 1 else 'families'}: "
                    f"{', '.join(missing)} — narrowing the floor is a violation, "
                    f"not a preference")
              sys.exit(1)
          print(f"floor enforceable: select covers {', '.join(sorted(REQUIRED))}")
          PY
      - name: Lint
        run: ruff check .
      - name: Validate event data
        run: python3 scripts/validate.py
      # Exit 2 from drift.py means it could not check. Any non-zero fails here,
      # which is the right reading of both 1 and 2.
      - name: Rot checks
        run: python3 scripts/drift.py
      # Offline. Proves the venue's key is sent and never printed.
      - name: DICE reader self-test
        run: python3 scripts/dice.py --self-test
      - name: Check brief.yml parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('config/brief.yml')); yaml.safe_load(open('config/sources.yml')); print('config ok')"
      - name: Check docs/events.json is current
        run: |
          python3 scripts/build.py
          git diff --exit-code docs/events.json || (echo "::error::docs/events.json is stale — run scripts/build.py and commit" && exit 1)
