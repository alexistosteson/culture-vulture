# =============================================================================
# sources.yml — where to look
# =============================================================================
#
# Tiered by fidelity. Tier 1 gives exact times and prices; tier 3 gives
# coverage but thin detail. Work down the tiers, and prefer the highest tier
# that has the event.
#
# Adding a venue is a one-line PR. If you fork this for another city, replace
# tier_1 wholesale and keep the tier_2/tier_3 shapes.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# TIER 1 — venue calendars, polled directly. Highest fidelity.
# -----------------------------------------------------------------------------
tier_1_venues:

  sf:
    - { name: The Independent,        url: "https://www.theindependentsf.com/",        cap: 500 }
    - { name: Great American Music Hall, url: "https://gamh.com/calendar/",            cap: 600 }
    - { name: The Chapel,             url: "https://thechapelsf.com/calendar/",        cap: 500 }
    - { name: Bottom of the Hill,     url: "https://www.bottomofthehill.com/calendar.html", cap: 350,
        note: "Announced closure at end of 2026 — worth flagging while it lasts." }
    - { name: Rickshaw Stop, url: "https://rickshawstop.com/calendar/", cap: 400,
        note: "The bare domain serves a stale 2024 calendar. Always use /calendar/." }
    - { name: Bimbo's 365 Club,       url: "https://bimbos365club.com/",               cap: 500 }
    - { name: Brick & Mortar Music Hall, url: "https://www.brickandmortarmusic.com/",  cap: 300 }
    - { name: Café du Nord,           url: "https://www.cafedunord.com/",              cap: 300 }
    - { name: DNA Lounge, url: "https://www.dnalounge.com/calendar/{YYYY}/{MM}.html", cap: 500,
        note: "Build the URL for the target month, zero-padded. /calendar/ alone is only a year index." }
    - { name: Public Works,           url: "https://publicsf.com/",                    cap: 800 }
    - { name: Regency Ballroom,      url: "https://www.jambase.com/venue/the-regency-ballroom", cap: 1400,
        note: "Added 2026-08-18. Was missing entirely, and cost the 17 Aug week Los Mirlos and a Sword/Red Fang bill." }
    - { name: August Hall,            url: "https://www.augusthallsf.com/",            cap: 750 }
    - { name: The Warfield,           url: "https://www.thewarfieldtheatre.com/",      cap: 2300 }
    - { name: SFJAZZ, url: "https://www.jambase.com/venue/miner-auditorium-sfjazz-center", cap: 700,
        note: "sfjazz.org 403s on every path — this JamBase mirror is the only fetchable source. Summer Sessions end mid-August and the fall season starts in September, so an empty late-August week here is real, not a fetch failure." }
    - { name: Castro Theatre, url: "https://thecastro.com/", cap: 1400,
        note: "castrotheatre.com 301-redirects here; fetch the new domain directly." }
    - { name: Stern Grove Festival,   url: "https://www.sterngrove.org/lineup2026",    cap: 10000,
        note: "Free but lottery-ticketed — always state the access mechanism (GA lottery opens six weeks out; a 1,500-ticket Community Box Office goes first-come on the day). SEASON IS MID-JUNE TO MID-AUGUST: 2026 ran Jun 14–Aug 16 and closed with Al Green. Nothing here after that, whatever the homepage still says." }
    - { name: Roxie Theater,          url: "https://roxie.com/",                       cap: null,
        note: "Repertory and one-off screenings. Ignore the first-run showtimes." }
    - { name: The Fillmore,          url: "https://www.jambase.com/venue/the-fillmore", cap: 1315,
        note: "Added 2026-08-18. A 1,315-cap landmark that was somehow absent from this file, and cost the 17 Aug week three shows." }
    - { name: Gray Area,             url: "https://grayarea.org/events/", cap: 700,
        note: "Grand Theater, Mission. Experimental electronic, audiovisual and installation work — the `experimental and improv` emphasis in brief.yml has nowhere else to look." }
    - { name: Yerba Buena Center for the Arts, url: "https://ybca.org/whats-on/", cap: null,
        note: "Galleries free every Wednesday. State the free day, it is the point." }
    - { name: San Francisco Playhouse, url: "https://www.sfplayhouse.org/calendar/", cap: 199,
        note: "Two stages running concurrently. SF theatre coverage in this file was nil before 2026-08-18, which is why the digest kept reporting thin theatre weeks." }
    - { name: Z Space,               url: "https://www.zspace.org/", cap: 300,
        note: "Experimental theatre and dance in the Mission. URL corrected 2026-08-24 — /calendar returns 404 and the site has no central calendar path; shows are linked individually off the homepage (/sfmt, /lear, ...), so this one needs a click-through rather than a single fetch." }
    - { name: Fort Mason Center,     url: "https://fortmason.org/calendar/", cap: null,
        note: "Arts campus — festivals, fairs and one-offs across several halls." }
    - { name: 1015 Folsom,           url: "https://1015.com/", cap: 1000 }
    - { name: The Foundry SF, url: "https://www.thefoundry.club/", cap: 500,
        note: "URL corrected 2026-09-21 — thefoundrysf.com 308-redirects here and the fetch path does not follow cross-host redirects, so the old URL returned nothing." }
    - { name: Kilowatt,              url: "https://www.kilowattbar.com/", cap: 150 }
    - { name: Chase Center,          url: "https://www.chasecenter.com/events", cap: 18000,
        note: "Arena. `deprioritize` in brief.yml — list for completeness, never feature." }
    # Davies Symphony Hall / SF Symphony: sfsymphony.org sits behind a queueing
    # redirect and cannot be fetched directly. The orchestra's season is roughly
    # September to June, so an empty August is expected rather than a miss.

  east_bay:
    - { name: Fox Theater,            url: "https://thefoxoakland.com/",               cap: 2800 }
    - { name: Paramount Theatre,      url: "https://www.paramountoakland.org/",        cap: 3000 }
    - { name: Yoshi's,                url: "https://yoshis.com/",                      cap: 400 }
    - { name: The Greek Theatre,      url: "https://thegreekberkeley.com/",            cap: 8500 }
    - { name: The New Parkway,        url: "https://thenewparkway.com/",               cap: 200 }
    - { name: Thee Stork Club, url: "https://theestorkclub.com/calendar/", cap: 150,
        note: "URL corrected 2026-08-24 — theestorkclubopakland.com does not resolve (DNS NXDOMAIN), so this venue had been silently dark. The real domain has no 'oakland' in it. /calendar/ renders client-side and fetches empty; https://www.jambase.com/venue/thee-stork-club is the reliable read." }
    - { name: Ivy Room, url: "https://www.jambase.com/venue/the-ivy-room", cap: 150,
        note: "ivyroom.com/shows renders client-side and fetches empty." }
    - { name: Oakland Museum of California, url: "https://museumca.org/on-view/", cap: null }
    - { name: Freight & Salvage, url: "https://www.jambase.com/venue/freight-salvage", cap: 600,
        note: "thefreight.org 403s. A seated listening room, not a club." }
    - { name: The UC Theatre,         url: "https://theuctheatre.org/",                cap: null }
    - { name: Cornerstone,           url: "https://cornerstoneberkeley.com/events", cap: 300,
        note: "Beer hall on Shattuck with a real stage at the back." }
    - { name: 924 Gilman,            url: "https://924gilman.org/", cap: 300,
        note: "Volunteer-run all-ages punk institution. The site is a landing page — shows are behind its ticketing link, so this one needs a click-through rather than a single fetch." }
    # Starline Social Club — CLOSED. Both spaces are marked closed and the last
    # listed show was 11 June 2026. Left commented so it is not re-added by mistake.
    # - { name: Starline Social Club, url: "https://starlinesocialclub.com/", cap: null }
    - { name: BAMPFA,                 url: "https://bampfa.org/",                      cap: null,
        note: "Film programme and exhibitions both. Cite the series, not just the title." }
    - { name: Berkeley Rep, url: "https://berkeleyrep.org/season/", cap: null,
        note: "/whats-on/ is gone; /season/ is the calendar." }

  peninsula:
    - { name: The Guild Theatre,      url: "https://guildtheatre.com/",                cap: 500 }
    - { name: Filoli, url: "https://feverup.com/en/san-francisco/venue/filoli-historic-house-garden", cap: null,
        note: "filoli.org 403s. Fever carries only the ticketed programming, not the full calendar." }
    - { name: Music on the Square,    url: "https://www.redwoodcity.org/",             cap: null, free: true }

  south_bay:
    - { name: Shoreline Amphitheatre, url: "https://www.jambase.com/venue/shoreline-amphitheatre", cap: 22000,
        note: "mountainviewamphitheater.com 403s and shorelineamphitheatre.com fetches empty." }
    - { name: Mountain Winery, url: "https://www.jambase.com/venue/mountain-winery", cap: 2500,
        note: "Official site is JS-rendered and fetches empty; /events/ 403s. This mirror carries support billing." }
    - { name: SAP Center,             url: "https://www.sapcenter.com/",               cap: 17000 }
    - { name: San Jose Civic, url: "https://www.jambase.com/venue/san-jose-civic", cap: 3000,
        note: "sanjosetheaters.org 403s." }
    - { name: The Ritz, url: "https://www.livenation.com/venue/KovZ917AOqb/the-ritz-events", cap: 500,
        note: "Venue is OPEN. The old ritzsanjose.com domain is dead; theritzsanjose.com renders via JS and fetches empty." }
    - { name: Hammer Theatre Center, url: "https://sanjose.events/venue/hammer-theatre-center/", cap: 500,
        note: "hammertheatre.com/events/ reports 0 events while the venue is actively programming — do not read that as dark." }

  # The `outer` region — Santa Cruz, Marin, North Bay. Thin by design: only
  # things worth the drive clear the brief, so this list stays short.
  outer:
    - { name: The Catalyst,           url: "https://catalystclub.com/",                cap: null }
    - { name: Felton Music Hall,      url: "https://feltonmusichall.com/",             cap: null }
    - { name: Sweetwater Music Hall,  url: "https://sweetwatermusichall.org/",         cap: null }

# -----------------------------------------------------------------------------
# TIER 2 — regional aggregators. Best for free and community events that never
# reach a ticketing platform.
# -----------------------------------------------------------------------------
tier_2_aggregators:
  # Funcheap has NO month archive. /2026/08/ is a soft 404 — do not construct one.
  # Working shapes: /YYYY/MM/DD/ per day, /region/<slug>/, and /events/ rolling.
  - { name: SF Funcheap,      url: "https://sf.funcheap.com/{YYYY}/{MM}/{DD}/", covers: [sf, east-bay, peninsula, south-bay], strength: "free and community events",
      note: "Also https://sf.funcheap.com/region/<south-bay|east-bay|peninsula|san-francisco>/ for a whole region at once." }
  - { name: DoTheBay,         url: "https://dothebay.com/",          covers: [sf, east-bay],                        strength: "music and nightlife",
      fetchable: false,
      note: "403s at the domain level, every path. Useful for a human to browse, useless to poll — do not spend a fetch on it." }
  - { name: SF Station,       url: "https://www.sfstation.com/",     covers: [sf],                                  strength: "clubs and galleries" }
  - { name: Downtown SF,      url: "https://downtownsf.org/events",  covers: [sf],                                  strength: "weekday downtown programming" }
  - { name: Visit Oakland,    url: "https://www.visitoakland.com/events/", covers: [east-bay],                      strength: "festivals and street events" }
  - { name: sanjose.events,   url: "https://sanjose.events/",        covers: [south-bay],                           strength: "South Bay breadth" }

  # Editorial picks rather than listings. They surface the thing worth going to
  # when the calendars only say what is on — useful for the digest's judgement,
  # never sufficient on their own. Verify date, time and price against tier 1.
  - { name: The SF Standard, url: "https://sfstandard.com/arts-culture/", covers: [sf],                             strength: "critics' picks and openings" }
  - { name: 48 Hills,        url: "https://48hills.org/",           covers: [sf, east-bay],                        strength: "underground and DIY, the venues nobody aggregates" }
  - { name: KQED Arts,       url: "https://www.kqed.org/arts",      covers: [sf, east-bay, peninsula, south-bay],  strength: "week-ahead roundups across the whole region" }
  - { name: Chronicle Datebook, url: "https://datebook.sfchronicle.com/", covers: [sf, east-bay, peninsula, south-bay], strength: "breadth and reviews",
      note: "Paywalled. Use for what exists and what is worth seeing; get the details elsewhere." }
  - { name: East Bay Express, url: "https://eastbayexpress.com/",   covers: [east-bay],                            strength: "Oakland and Berkeley listings" }
  - { name: The Other SF,    url: "https://theothersf.com/",        covers: [sf],                                  strength: "small and offbeat programming" }

# -----------------------------------------------------------------------------
# TIER 3 — ticketing feeds. Broad coverage, thin detail. Snippets often omit
# the artist name, so verify against tier 1 before publishing.
# -----------------------------------------------------------------------------
tier_3_feeds:
  - { name: Songkick, url: "https://www.songkick.com/metro-areas/26330-us-sf-bay-area", note: "Best single sweep of the region. Paginate by date." }
  # Tier 3 by convention, tier 1 in practice: the per-venue pages carry exact
  # dates AND support billing, and they are what rescued SFJAZZ, Freight &
  # Salvage, Mountain Winery, Shoreline, San Jose Civic and the Ivy Room when
  # those venues' own sites blocked or broke. Prefer a venue-specific JamBase
  # URL over the generic sweep.
  - { name: JamBase,   url: "https://www.jambase.com/venue/{venue-slug}" }
  - { name: Bandsintown, url: "https://www.bandsintown.com/", fetchable: false,
      note: "403s domain-wide, venue pages included. JamBase covers the same ground and does fetch — reach for that instead." }

# -----------------------------------------------------------------------------
# Known recurring programming. Compiled once, carried forward, verified
# monthly rather than re-researched every week.
#
# A SEASON IS PART OF THE CADENCE. Several entries here were written as though
# they ran all year, and the 2026-08-17 run wasted its outer-region budget
# looking for concerts that had finished a fortnight earlier. Where a series
# has a season, `cadence` states it, and `season_ends` carries the last date
# actually confirmed — treat a window past that date as unverified, not as
# programming that failed to appear.
# -----------------------------------------------------------------------------
recurring:
  - { name: Oakland First Fridays,  region: east-bay,  cadence: "1st Friday, 5–9:30pm",     cost: free }
  - { name: Oakland Art Murmur,     region: east-bay,  cadence: "1st Friday, 6–9pm",        cost: free }
  - { name: Second Friday Artwalk,  region: east-bay,  cadence: "2nd Friday",               cost: free }
  - { name: Friday Nights at OMCA,  region: east-bay,  cadence: "Fridays, Apr–Oct, from 5pm", cost: free }
  - { name: Concerts at the Lake,   region: east-bay,  cadence: "Sundays 1–3pm, early Jul–early Aug ONLY", cost: free,
      season_ends: 2026-08-02,
      note: "Oakland Municipal Band, Lakeside Park. A five-date season, not a standing Sunday fixture — 2026 ran Jul 4, 12, 19, 26 and Aug 2." }
  - { name: Downtown First Thursdays, region: sf,      cadence: "1st Thursday, 5–10pm",     cost: free }
  - { name: Inner Sunset Flea,      region: sf,        cadence: "2nd Sunday, Apr–Nov",      cost: free }
  - { name: Lindy in the Park,      region: sf,        cadence: "Sundays, 11am–2pm",        cost: free }
  - { name: Golden Gate Park Band, region: sf,        cadence: "Sundays 1–2:30pm, Apr–Sep", cost: free,
      note: "Spreckels Temple of Music, Music Concourse. Free municipal band since 1882, 144th season in 2026 — a standing Sunday fixture that was missing from this list until 2026-08-18." }
  - { name: Chinatown Night Market, region: sf,        cadence: "2nd Friday, May–Oct, 5–9pm", cost: free,
      note: "Grant Ave; 'monthly Fridays' was too loose to place on a calendar." }
  - { name: Head West Marketplace,  region: varies,    cadence: "Most weekends, rotating",  cost: free }
  - { name: Sips & Sounds of Summer, region: south-bay, cadence: "Tuesdays 6–8pm, Aug–Sep", cost: free,
      note: "Santana Row Park, near Left Bank. Previously filed here as 'Santana Row Summer Music'." }
  - { name: Music on the Square,    region: peninsula, cadence: "Fridays, 6–8pm, summer",   cost: free }
  - { name: Movies on the Square,   region: peninsula, cadence: "Thursdays, 6–10pm, summer", cost: free,
      note: "Courthouse Square, Redwood City — same square as the Friday concerts. Family film at 6, main feature 8:30." }
  - { name: Palo Alto Twilight Concert Series, region: peninsula, cadence: "SATURDAYS, 6:30pm, summer", cost: free,
      note: "Was recorded here as Sundays, which is wrong and cost a week's listing. Alternates between Rinconada Park and Mitchell Park." }
  - { name: Colma Summer Concert Series, region: peninsula, cadence: "Thursdays 6–8pm, August", cost: free,
      note: "On the grass at the Colma Community Center. BART Colma genuinely beats driving." }
  - { name: "Beats, Brews & Vines", region: peninsula, cadence: "3rd Thursday 6–8pm, Aug–Oct", cost: free,
      note: "Downtown Millbrae, Broadway at Hillcrest." }
  - { name: San Jose Bike Party,    region: south-bay, cadence: "3rd Friday, meet 7:30pm",  cost: free,
      note: "Start point announced the week of the ride." }

# -----------------------------------------------------------------------------
# Practical notes the compiler should surface when relevant.
# -----------------------------------------------------------------------------
local_knowledge:
  - "Stern Grove is free but lottery-ticketed, with a same-weekend in-person Community Box Office. Always state the mechanism."
  - "Stern Grove is eucalyptus-shaded and foggy regardless of forecast. Recommend layers."
  - "Oakland garage break-ins are common. Recommend transit for downtown Oakland events."
  - "Most downtown Oakland garages close gates at 7pm on weekdays. Verify closing time before parking for an evening event."
  - "Outside Lands weekend closes the west end of Golden Gate Park and overwhelms the N-Judah and 5-Fulton."
  - "From the Peninsula, BART park-and-ride at Fremont or Union City beats driving into Oakland."
