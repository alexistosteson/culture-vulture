# =============================================================================
# sources.yml — where to look
# =============================================================================
#
# Tiered by fidelity. Tier 1 gives exact times and prices; tier 3 gives
# coverage but thin detail. Work down the tiers, and prefer the highest tier
# that has the event.
#
# Adding a venue is a one-line PR. If you fork this for another city, replace
# tier_1 wholesale and keep the tier_2/tier_3 shapes.
#
# `venues:` — the venue strings an entry answers to when its `name` is not the
# string the listings use (SFJAZZ plays in "Miner Auditorium, SFJAZZ"; Music on
# the Square happens in "Courthouse Square"). scripts/drift.py matches on it. A
# comma-suffixed spelling goes here as an alias; never cut a name at the comma.
#
# `found_via:` — on `observed_venues` at the foot of this file: how a venue the
# digest keeps listing is actually reached, when it has no page of its own that
# a plain fetch reads in full.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
