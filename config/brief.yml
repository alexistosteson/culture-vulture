  # Corridors, in priority order — FIRST MATCH WINS, so the specific boxes come
  # before the broad ones. `box` is pure geometry against the destination; every
  # bound is optional, mins inclusive and maxes exclusive. `mph` is an effective
  # door-to-door average,
  # not a speed limit. `peak` windows are decimal hours of the DEPARTURE time,
  # `when` is weekday or weekend, `add` is minutes.
  corridors:
    - id: "17"
      label: CA-17 over the hill
      mph: 36
      box: {lat_max: 37.16}
      peak:
        - {from: 15, to: 19, when: weekday, add: 20, note: 17 stacks up at Los Gatos from mid-afternoon}
        - {from: 17, to: 21, when: weekend, add: 14, note: weekend beach traffic northbound in the evening}

    - id: 85-9
      label: CA-85 → CA-9
      mph: 38
      box: {lat_max: 37.34, lng_max: -122.00}
      peak:
        - {from: 16, to: 19, when: weekday, add: 10, note: 85 southbound thickens after 4}

    - id: 101S
      label: US-101 S / CA-85
      mph: 40
      box: {lat_max: 37.40, lng_min: -122.06}
      peak:
        - {from: 16, to: 19, when: weekday, add: 16, note: 101 south through Sunnyvale is stop-and-go from 4}

    - id: 280N
      label: I-280 N
      mph: 52
      box: {lat_min: 37.39, lat_max: 37.72, lng_max: -122.15}
      peak:
        - {from: 16.5, to: 18.5, when: weekday, add: 10, note: 280 north loosens up after 6}

    - id: 101N-pen
      label: US-101 N
      mph: 42
      box: {lat_min: 37.39, lat_max: 37.72}
      peak:
        - {from: 15.5, to: 19, when: weekday, add: 20, note: 101 north is the worst of the peninsula — 280 is usually faster}

    - id: 101N-sf
      label: US-101 N → I-280
      mph: 42
      box: {lat_min: 37.70, lng_max: -122.34}
      peak:
        - {from: 15.5, to: 19.5, when: weekday, add: 24, note: "101 north clogs from Redwood City at 3:30; the 280 split at Daly City is the second squeeze"}
        - {from: 11, to: 14, when: weekend, add: 12, note: weekend midday backs up into the city}

    - id: "24"
      label: I-880 N → CA-24
      mph: 44
      toll: $8 Dumbarton, westbound only
      box: {lat_min: 37.90, lng_min: -122.10}
      peak:
        - {from: 16, to: 19, when: weekday, add: 22, note: the Caldecott is the pinch — eastbound clears by 7}

    - id: gg
      label: US-101 N → Golden Gate Bridge
      mph: 44
      toll: $10 bridge toll, southbound only
      box: {lat_min: 37.85, lng_max: -122.40}
      peak:
        - {from: 15.5, to: 19, when: weekday, add: 20, note: Waldo Grade northbound is the bottleneck}

    - id: "880"
      label: CA-84 Dumbarton → I-880 N
      mph: 42
      toll: $8 Dumbarton, westbound only
      box: {lng_min: -122.36}
      peak:
        - {from: 16, to: 19, when: weekday, add: 18, note: Dumbarton eastbound is fine; the toll and the queue are on the way home}

  # Anything closer than local_miles never touches a freeway corridor. Picking
  # one by geometry alone put 1-mile trips on the Dumbarton bridge.
  local_miles: 6
  local:
    id: local
    label: surface streets
    mph: 26
    peak:
      - {from: 16, to: 18.5, when: weekday, add: 5, note: local arterials get slow around the school and commute peak}
  # Used when no corridor box matches at all.
  fallback: {id: road, label: surface roads, mph: 38, peak: []}

# -----------------------------------------------------------------------------
# WHAT — the taste layer
# -----------------------------------------------------------------------------
interests:

  # Ranked. When the week is crowded and something has to go, cut from the
  # bottom. `why` is for humans and for the LLM's editorial judgement alike.
  priorities:
    - id: live-music
      why: The spine of the digest. Small and mid-size rooms over arenas.
    - id: free-outdoor
      why: >-
        Free public programming is the thing most likely to be missed and most
        likely to be worth going to. Park concerts, street fairs, night markets.
    - id: art-and-galleries
      why: Openings, art walks, museum late nights, artist-run spaces.
    - id: theater-dance-opera
      why: Include experimental and small-company work, not just the big houses.
    - id: markets-and-makers
      why: Craft fairs, flea markets, vintage. Skip pure retail promotions.
    - id: food-festivals
      why: Only genuine festivals. Not restaurant weeks or bar specials.
    - id: film
      why: Repertory, festivals, and one-off screenings. Not regular showtimes.
    - id: talks-and-oddities
      why: >-
        The catch-all for things that are interesting because they're strange —
        competitive horticulture, diary-reading nights, roller discos.
    - id: sports
      why: Minor-league and local only. Cheap, walkable, atmospheric.

  # Genre coverage for music. `emphasis` gets sought out actively; `include`
  # gets listed when found; anything not listed still gets included if the
  # booking is notable — these are weights, not a whitelist.
  music:
    emphasis:
      - soul and funk
      - jazz
      - latin and cumbia
      - hip-hop
      - indie and art rock
      - folk and americana
      - world and traditional
      - experimental and improv
    include:
      - electronic and club
      - punk and hardcore
      - metal
      - classical and opera
      - country
      - reggae
      - pop and k-pop
      - tribute and legacy acts

  # Venue sizes worth favouring when two events compete for a slot.
  #
  # `civic` covers community centres, school grounds, libraries and municipal
  # halls — the buildings a town already owns. It earns `prefer` because the
  # programming that lands there is usually free, usually local, and almost
  # never reaches a ticketing platform, which is exactly what the digest is
  # for. `convention-center` is deprioritized on the same logic as `arena`:
  # a promoter big enough to book one is big enough to be findable already.
  venue_bias:
    prefer: [club, gallery, church, park, street, estate, winery, civic]
    include: [theater, concert-hall, amphitheater, museum, ballpark, rooftop]
    deprioritize: [arena, stadium, convention-center]

# -----------------------------------------------------------------------------
# WHAT NOT — exclusions
# -----------------------------------------------------------------------------
# Hard filters. If an event matches any of these, it does not appear.
exclusions:
  hard:
    - id: paid-placement
      match: [sponsored, advertisement, promoted listing]
      why: The digest has no advertising and should not launder any.
    - id: private-or-ticketed-networking
      match: [members only, private event, invite only]
      why: Can't act on it, so don't list it.
    - id: retail-promotions
      match: [sale, grand opening, happy hour, trunk show]
      why: Commerce wearing a culture costume.
    - id: recurring-nightlife-noise
      match: [bottle service, table reservations, guest list]
      why: Club promo, not programming.
    - id: conferences
      match: [summit, conference, expo, trade show]
      why: >-
        Professional events aren't culture. Exception: if it has open public
        programming, list only that part.

  # Softer. These get included but ranked low, and cut first when crowded.
  soft:
    - id: arena-shows
      why: Findable without help. Include for completeness, never feature.
    - id: chain-venue-comedy
      why: Standing weekly programming, low information value.
    - id: tribute-bands
      why: >-
        Include — they're a real part of the free-concert circuit — but never
        feature one over an original act.

  # OPTIONAL. Named things to always skip, whatever the reason.
  blocklist:
    venues: []
    keywords: []

# -----------------------------------------------------------------------------
# HOW MUCH
# -----------------------------------------------------------------------------
coverage:
  # `everything` lists all qualifying events. `curated` caps each region.
  mode: everything
  # Only applies when mode is `curated`.
  max_per_region_per_day: 8
  # An `outer` region event needs a real argument for the drive. The LLM should
  # apply this as an editorial test, not a keyword match.
  outer_threshold: >-
    Include only if it would be among the top three events of the week were it
    local — a rare tour, a legacy act, or a venue that is itself the draw.
    Otherwise omit. Say plainly when nothing clears the bar.
  # Events that recur weekly/monthly go in a standing table rather than being
  # repeated under every date they touch.
  collapse_recurring: true

# -----------------------------------------------------------------------------
# VOICE
# -----------------------------------------------------------------------------
voice:
  register: >-
    Informed enthusiast writing for a friend. Specific over clever. No
    marketing copy, no exclamation points, no "don't miss".
  genre_notes: >-
    Every music listing gets a one-line genre description in the compiler's own
    words — what it sounds like, not what the press release claims. Name the
    lineage where it's useful. Where a lineup is unannounced, describe the
    room's typical booking and label it as such.
  editorial_calls:
    - Say which event is the best of a crowded night, and why.
    - Flag when two good things conflict.
    - Note practical friction: fog, street closures, parking, transit, sellouts.
    - Mark low-confidence descriptions rather than bluffing.
  avoid:
    - Restating the event title as the description.
    - Hedging every claim into uselessness.
    - Treating every listing as equally good.

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------
output:
  # Machine-readable record set. Validated against schema/events.schema.json.
  json: data/{window_start}.json
  # Human-readable digest.
  markdown: digests/{window_start}.md
  # What the site reads.
  site_data: docs/events.json
  # Primary grouping in the markdown. `day` or `region`.
  group_by: day
  # Within a group, order by this.
  sort_within: region_rank
  featured_max: 8
