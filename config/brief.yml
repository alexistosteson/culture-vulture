# =============================================================================
# brief.yml — what to look for each week
# =============================================================================
#
# This file is the whole knob. An LLM reads it and researches accordingly;
# a human reads it and understands what the digest is trying to be.
#
# TO MAKE IT YOURS: fork the repo, change `origin` to where you live, reorder
# `regions`, and rewrite `interests` and `exclusions`. Nothing else needs to
# change.
#
# TO PROPOSE A CHANGE HERE: open a PR against this file. Prose in `voice` and
# the `why` fields is as reviewable as the lists — that's deliberate. Argue for
# a taste change the same way you'd argue for a code change.
#
# Every key is documented inline. Anything marked OPTIONAL may be deleted.
# =============================================================================

version: 1

meta:
  title: Bay Area Arts, Culture & Curiosities
  # Shown under the masthead. One sentence, plain.
  # {origin} is replaced with origin.label at build time — leave it in and the
  # line stays true after you move the starting point.
  standfirst: >-
    Arts, music, and worthwhile oddities, ordered by remove from {origin}.
  maintainer: "@alexistosteson"

# -----------------------------------------------------------------------------
# WHEN
# -----------------------------------------------------------------------------
schedule:
  # Day the research runs. The digest publishes that evening.
  run_on: monday
  # How many days forward the detailed digest covers, counting the run day.
  window_days: 7
  # OPTIONAL. Weeks of shallow lookahead beyond the detailed window — headliners
  # and festivals only, no club-level detail. Set to 0 to disable.
  lookahead_weeks: 3
  timezone: America/Los_Angeles

# -----------------------------------------------------------------------------
# WHERE
# -----------------------------------------------------------------------------
# `origin` anchors the geography. Regions are ordered by remove from it, and
# that order becomes the default sort. Rank 1 is home.
#
# This block is the starting point, and it is the only place it is written down.
# `scripts/build.py` copies `origin` and `regions` (id, label, rank, blurb,
# color) into docs/events.json on every build, and the site reads them from
# there — so moving the starting point means editing these lines and rebuilding.
# Nothing in index.html needs to change, including the region colours.
origin:
  label: Mountain View
  lat: 37.3861
  lng: -122.0839

# Region colours run light at rank 1 to dark at rank 5 — remove-from-origin is
# carried by LIGHTNESS, not hue alone. That ordering is what keeps the regions
# apart for red-green colour blindness, which flattens hue but leaves lightness
# intact. If you re-colour these, keep the lightness ramp; picking five pretty
# hues at similar lightness is what the pre-viridis palette did, and two pairs
# of it collapsed under deuteranopia.
#
# This is the Almanac ramp (warm head, cool tail), which replaced viridis in
# v0.5. Rank 4 turning indigo is deliberate: it separates the two darkest
# regions on hue as well as lightness, where an all-warm ramp gets into
# trouble. Measured with the Brettel/Viénot/Mollon two-plane dichromat
# simulation, minimum CIE76 ΔE across all ten region pairs, worst case over
# normal/protan/deutan/tritan: this ramp 22.7, viridis 18.9, an earlier
# all-warm attempt 16.3. Re-colour the same way and do not ship below ~19.
regions:
  - id: south-bay
    label: South Bay
    rank: 1
    blurb: San Jose, Saratoga, Sunnyvale, Mountain View
    color: "#F7E6B0"
    includes: [San Jose, Santa Clara, Sunnyvale, Mountain View, Saratoga, Campbell, Los Gatos, Cupertino]

  - id: peninsula
    label: Peninsula
    rank: 2
    blurb: Los Altos to Colma
    color: "#E29C46"
    includes: [Los Altos, Palo Alto, Stanford, Menlo Park, Woodside, Redwood City, San Carlos, Belmont, San Mateo, Foster City, Burlingame, Millbrae, Colma, Half Moon Bay]

  - id: sf
    label: San Francisco
    rank: 3
    blurb: City and county
    color: "#B4472B"
    includes: [San Francisco]

  - id: east-bay
    label: Berkeley & Oakland
    rank: 4
    blurb: Across the bay
    color: "#42406E"
    includes: [Oakland, Berkeley, Alameda, Emeryville, Albany, Concord, Walnut Creek]

  # `outer` is a holding pen, not a region. Things here must clear a higher bar
  # (see coverage.outer_threshold) and are grouped under "Worth the Drive".
  - id: outer
    label: Worth the Drive
    rank: 5
    blurb: Santa Cruz, Marin, North Bay
    color: "#14161B"
    includes: [Santa Cruz, Felton, Mill Valley, San Rafael, Novato, San Anselmo, Sebastopol, Napa, Sonoma]

# -----------------------------------------------------------------------------
# HOW TO GET THERE
# -----------------------------------------------------------------------------
# Two authored tables the "how to get there" panel needs. `scripts/build.py`
# copies this whole block onto docs/events.json as `meta.travel`, exactly as it
# copies `regions` — the page holds no geography of its own, so a fork pointed
# at another city replaces these lines and nothing else.
#
# Everything else is DERIVED in the page from lat/lng: haversine distance from
# `origin`, drive time (miles / mph * 60 + 7, plus the peak penalty), the
# corridor, the departure time, the warning. There is no live-traffic API and
# there must not be one — every number here is a stated estimate, and the panel
# says so.
